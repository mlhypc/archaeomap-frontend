<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2a2a2a" />
    <meta name="description" content="Explore how cities evolved from ancient times to today. ArchaeoMap offers an interactive historical map with timelines and detailed insights." />
    <meta name="keywords" content="history, cities, archaeology, interactive map, ancient cities, timelines" />
    <meta name="author" content="ArchaeoMap Team" />
    <link rel="canonical" href="https://archaeomap.com/" />

    <!-- Open Graph for social sharing -->
    <meta property="og:title" content="ArchaeoMap — Explore Ancient Cities Through Time" />
    <meta property="og:description" content="An interactive historical map that visualizes city development through time." />
    <meta property="og:image" content="%PUBLIC_URL%/preview.png" />
    <meta property="og:url" content="https://archaeomap.com" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArchaeoMap" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArchaeoMap — Explore Ancient Cities Through Time" />
    <meta name="twitter:description" content="Discover the historical evolution of world cities with ArchaeoMap's interactive timeline and map." />
    <meta name="twitter:image" content="%PUBLIC_URL%/preview.png" />

    <!-- Icons and Manifest -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "ArchaeoMap",
      "url": "https://archaeomap.com",
      "description": "An interactive historical map that visualizes city development through time. Explore ancient cities, their rulers, landmarks, and population changes across millennia.",
      "applicationCategory": "Map",
      "inLanguage": "en",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "operatingSystem": "Web Browser",
      "browserRequirements": "Requires JavaScript",
      "featureList": [
        "Interactive timeline with animated transitions",
        "Color-coded markers for active and ended cities",
        "Detailed city information including rulers and landmarks",
        "Population history tracking",
        "Responsive mobile interface"
      ],
      "keywords": "ancient cities, historical map, archaeology, timeline, interactive map, city evolution, historical geography",
      "creator": {
        "@type": "Organization",
        "name": "ArchaeoMap Team",
        "email": "melih@archaeomap.com"
      }
    }
    </script>

    <!-- FAQ Structured Data for AI Chatbots -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is ArchaeoMap?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ArchaeoMap is an interactive historical map that visualizes the evolution of human settlements and ancient cities across time. Users can explore city development through an animated timeline, view detailed information about rulers, landmarks, and population changes."
          }
        },
        {
          "@type": "Question",
          "name": "What time period does ArchaeoMap cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ArchaeoMap covers cities from prehistoric settlements to modern metropolises, spanning thousands of years of human history including ancient civilizations, classical periods, and beyond."
          }
        },
        {
          "@type": "Question",
          "name": "Is ArchaeoMap free to use?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes, ArchaeoMap is completely free to use. It's a web-based application accessible through any modern web browser."
          }
        },
        {
          "@type": "Question",
          "name": "What information can I find about each city?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For each city, you can explore founding dates, end dates (if applicable), rulers and empires that controlled the city over time, notable landmarks and monuments, population history, and detailed historical descriptions."
          }
        },
        {
          "@type": "Question",
          "name": "How do I use the timeline feature?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Use the interactive timeline slider to navigate through different historical periods. The map will automatically update to show which cities existed during your selected time period, with color-coded markers indicating active and ended cities."
          }
        }
      ]
    }
    </script>

    <title>ArchaeoMap — Explore Ancient Cities Through Time</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run ArchaeoMap.</noscript>
    <div id="root"></div>
  </body>
</html>
